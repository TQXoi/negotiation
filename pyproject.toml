[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-negotiation-belief-planner"
version = "0.1.0"
description = "Cross-environment belief-usable planning for language-model negotiation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "openai>=1.0", "requests>=2.28"]

[project.optional-dependencies]
local = ["torch>=2.1", "transformers>=4.40", "accelerate>=0.29"]
train = ["datasets>=2.18", "peft>=0.10", "scikit-learn>=1.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["framework*", "Simple_Env*", "CaSiNo_Env*", "AgenticPay_Env*", "experiments*"]
exclude = ["NegotiationArena*", "benchmarks*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests", "Simple_Env/tests"]
addopts = "-ra"
